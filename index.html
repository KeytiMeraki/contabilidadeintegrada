            const localizedDate = protocolDate.match(/(?:^|\/)(20\d{2})$/);

        const saveProtocol = async (protocolData) => {
            const protocolYear = String(protocolData.ano || new Date().getFullYear());
            if (!/^\d{4}$/.test(protocolYear)) throw new Error('Ano inválido para a numeração do protocolo.');
            const protocolDataWithYear = { ...protocolData, ano: protocolYear };
            if (state.useLocalFallback) {
                const localData = JSON.parse(localStorage.getItem('sys_data') || JSON.stringify(state.data));
                localData.protocolos ||= [];
                localData.protocoloCounters ||= {};
                const latestKnownNumber = Math.max(0, ...(localData.protocolos || [])
                    .filter(item => getProtocolYearFromRecord(item) === protocolYear)
                    .map(item => Number(item.protocoloNumero || 0)));
                const nextNumber = Math.max(Number(localData.protocoloCounters[protocolYear] || 0), latestKnownNumber) + 1;
                localData.protocoloCounters[protocolYear] = nextNumber;
                const protocol = {
                    ...protocolDataWithYear,
                    type: 'protocolo',
                    protocoloNumero: nextNumber,
                    id: `local_protocol_${protocolYear}_${Date.now()}_${nextNumber}`,
                    createdAt: new Date().toISOString()
                };
                localData.protocolos.unshift(protocol);
                localStorage.setItem('sys_data', JSON.stringify(localData));
                state.data.protocolos = localData.protocolos;

                        .filter(item => getProtocolYearFromRecord(item) === protocolYear)
                        .map(item => Number(item.protocoloNumero || 0)));
                    const nextNumber = Math.max(Number(counterSnapshot.data()?.lastNumber || 0), latestKnownNumber) + 1;
                    const protocol = {
                        ...protocolDataWithYear,
                        type: 'protocolo',
                        protocoloNumero: nextNumber,
                        createdAt: serverTimestamp()
                    };
                    transaction.set(counterRef, { type: 'protocoloCounter', ano: protocolYear, lastNumber: nextNumber });
                    transaction.set(protocolRef, protocol);
                    return { ...protocol, id: protocolRef.id };
                });
            } catch (error) {

        const getNationalHolidaysForYear = (year) => {
            const fixedHolidays = [
                [`${year}-01-01`, 'Confraternização Universal'],
                [`${year}-04-21`, 'Tiradentes'],
                [`${year}-05-01`, 'Dia Mundial do Trabalho'],
                [`${year}-09-07`, 'Independência do Brasil'],
                [`${year}-10-12`, 'Nossa Senhora Aparecida'],
                [`${year}-11-02`, 'Finados'],
                [`${year}-11-15`, 'Proclamação da República'],
                [`${year}-11-20`, 'Dia Nacional de Zumbi e da Consciência Negra'],
                [`${year}-12-25`, 'Natal']
            ];
            const a = year % 19;
            const b = Math.floor(year / 100);
            const c = year % 100;
            const d = Math.floor(b / 4);
            const e = b % 4;
            const f = Math.floor((b + 8) / 25);
            const g = Math.floor((b - f + 1) / 3);
            const h = (19 * a + b - d - g + 15) % 30;
            const i = Math.floor(c / 4);
            const k = c % 4;
            const l = (32 + 2 * e + 2 * i - h - k) % 7;
            const m = Math.floor((a + 11 * h + 22 * l) / 451);
            const easterMonth = Math.floor((h + l - 7 * m + 114) / 31);
            const easterDay = ((h + l - 7 * m + 114) % 31) + 1;
            const goodFriday = new Date(Date.UTC(year, easterMonth - 1, easterDay - 2));
            const goodFridayKey = `${goodFriday.getUTCFullYear()}-${String(goodFriday.getUTCMonth() + 1).padStart(2, '0')}-${String(goodFriday.getUTCDate()).padStart(2, '0')}`;

                else if (type === 'user') localData.users = localData.users.filter(u => u.id !== id && u.username !== id);
                else if (type === 'accessRequest') localData.accessRequests = (localData.accessRequests || []).filter(request => request.id !== id);
                localStorage.setItem('sys_data', JSON.stringify(localData));
                state.data = localData;
                refreshViewForDataChanges(new Set([type]));
                return;
            }

            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'data', id));
            } catch (error) {
                console.error(`Erro ao excluir ${type} do banco de dados:`, error);
                throw error;
            }
        };

        const updatePendenciaStatusDB = async (id, newStatus) => {
            if (state.useLocalFallback) {
                const localData = JSON.parse(localStorage.getItem('sys_data') || JSON.stringify({ contas: [], logs: [], pendencias: [], users: DEFAULT_USERS }));
                const pend = localData.pendencias.find(p => p.id === id);
                if (pend) {
                    pend.status = newStatus;
                    localStorage.setItem('sys_data', JSON.stringify(localData));
                    state.data = localData;
                    refreshViewForDataChanges(new Set(['pendencia']));
                }
                return;
            }

            try {
                await updateDoc(doc(db, 'artifacts', appId, 'data', id), { status: newStatus });
            } catch (error) {
                showToast("Erro ao atualizar status.", "error");
            }
        };

        const logAction = async (actionDesc) => {
            if (!state.currentUser) return;
            try {
                await saveToDatabase({
                    type: 'log',
                    user: state.currentUser.username,
                    name: state.currentUser.name,
                    action: actionDesc,
                    timestamp: 'serverTimestamp'
                });
            } catch (error) {
                console.error("Erro ao salvar log:", error);
            }
        };

        const setupRealtimeListeners = () => {
            state.unsubscribe.forEach(unsub => unsub());
            state.unsubscribe = [];
            if (state.useLocalFallback) return;

            const unsubData = onSnapshot(query(getDataPath()), (snapshot) => {
                const contas = [], receitas = [], funcionarios = [], ferias = [], feriados = [], protocolos = [], protocoloFonte = [], logs = [], pendencias = [], users = [], accessRequests = [];
                let diariasConfig = state.data.diariasConfig;
                const oldTypesById = new Map(
                    Object.values(state.data).flat()
                        .filter(item => item && item.id && item.type)
                        .map(item => [item.id, item.type])
                );
                const changedTypes = new Set();
                snapshot.docChanges().forEach(change => {
                    const currentType = change.doc.data().type;
                    const previousType = oldTypesById.get(change.doc.id);
                    if (currentType) changedTypes.add(currentType);
                    if (previousType) changedTypes.add(previousType);
                });
                snapshot.forEach(docSnap => {
                    const data = { ...docSnap.data(), id: docSnap.id };
                    if (data.type === 'conta') contas.push(data);
                    else if (data.type === 'receita') receitas.push(data);
                    else if (data.type === 'funcionario') funcionarios.push(data);
                    else if (data.type === 'ferias') ferias.push(data);
                    else if (data.type === 'feriado') feriados.push(data);
                    else if (data.type === 'protocolo') protocolos.push(data);
                    else if (data.type === 'protocoloFonte') protocoloFonte.push(data);
                    else if (data.type === 'log') logs.push(data);
                    else if (data.type === 'pendencia') pendencias.push(data);
                    else if (data.type === 'user') users.push(data);
                    else if (data.type === 'accessRequest') accessRequests.push(data);
                    else if (data.type === 'diariasConfig') diariasConfig = data;
                });

                state.data.contas = contas.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                state.data.receitas = receitas.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                state.data.funcionarios = funcionarios.sort((a, b) => String(a.nome || '').localeCompare(String(b.nome || ''), 'pt-BR'));
                state.data.ferias = ferias;
                state.data.feriados = feriados.sort((a, b) => String(a.data || '').localeCompare(String(b.data || '')));
                state.data.protocolos = protocolos.sort((a, b) => Number(b.protocoloNumero || 0) - Number(a.protocoloNumero || 0));
                state.data.protocoloFonte = protocoloFonte;
                state.data.logs = logs.sort((a, b) => (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0));
                state.data.pendencias = pendencias.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                state.data.accessRequests = accessRequests.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                state.data.diariasConfig = diariasConfig || {
                    type: 'diariasConfig',
                    id: 'diarias_config',
                    url: '',
                    message: DEFAULT_DIARIAS_MESSAGE
                };
                
                if (users.length === 0) {
                    DEFAULT_USERS.forEach(async (u) => {
                        await saveToDatabase({ type: 'user', ...u });
                    });
                    state.data.users = DEFAULT_USERS;
                } else {
                    state.data.users = users;
                }
                const signedInUser = state.data.users.find(user => user.username === state.currentUser?.username);
                if (signedInUser) state.currentUser = { ...state.currentUser, ...signedInUser };

                refreshViewForDataChanges(changedTypes);
            }, (error) => {
                if (error.code === 'permission-denied') enableLocalFallback();
            });
            state.unsubscribe.push(unsubData);
        };

        const handleLogin = async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;

            let allUsers = state.data.users.length > 0 ? state.data.users : DEFAULT_USERS;
            if (state.useLocalFallback) {
                const localData = JSON.parse(localStorage.getItem('sys_data') || JSON.stringify({ users: DEFAULT_USERS }));
                allUsers = localData.users || DEFAULT_USERS;
            }

            const foundUser = allUsers.find(u => u.username === usernameInput && u.password === passwordInput);

            if (foundUser) {
                try {
                    await signInAnonymously(auth);
                    state.currentUser = { ...foundUser };
                    showToast(`Bem-vindo, ${state.currentUser.name}!`, 'success');
                    state.currentView = 'auditoria_nf';
                    setupRealtimeListeners();
                    await logAction('Realizou login no sistema');
                    renderApp();
                } catch (error) {
                    showToast('Erro ao conectar servidor seguro.', 'error');
                }
            } else {
                showToast('Usuário ou senha incorretos.', 'error');
            }
        };

                        ${state.currentView === 'login' ? `

                                Enviar Solicitação

                                <a href="#" id="link-voltar" class="text-gray-400 hover:text-white text-sm transition-colors">Já tem conta? Fazer login</a>

                    </div>

            if (state.currentView === 'login') {
                document.getElementById('login-form').addEventListener('submit', handleLogin);
                document.getElementById('link-solicitar').addEventListener('click', (e) => {

                    try {

                        showToast('Solicitação enviada ao Administrador.', 'success');
                        state.currentView = 'login';

                        console.error('Erro ao enviar solicitação de acesso:', error);

                ${isFinanceView ? `

            if (icon) icon.className = isLight ? 'fas fa-moon text-lg' : 'fas fa-sun text-lg';

        const callGeminiAPI = async (payload) => {
            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-preview:generateContent?key=${apiKey}`;
            const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            return await response.json();
        };

        window.toggleChat = () => {
            const win = document.getElementById('chatbot-window');
            win.style.display = win.style.display === 'none' || win.style.display === '' ? 'flex' : 'none';

            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;
            const msgContainer = document.getElementById('chatbot-messages');
            msgContainer.innerHTML += `<div class="chat-msg user">${message}</div>`;
            input.value = '';
            msgContainer.scrollTop = msgContainer.scrollHeight;
            try {
                state.chatHistory.push({ role: "user", parts: [{ text: message }] });
                const result = await callGeminiAPI({ contents: state.chatHistory });
                if (result.candidates && result.candidates.length > 0) {
                    const aiText = result.candidates[0].content.parts[0].text;
                    state.chatHistory.push({ role: "model", parts: [{ text: aiText }] });
                    msgContainer.innerHTML += `<div class="chat-msg ai">${aiText.replace(/\n/g, '<br>')}</div>`;
                }
            } catch (e) {
                msgContainer.innerHTML += `<div class="chat-msg ai text-red-400">Erro de conexão.</div>`;

            msgContainer.scrollTop = msgContainer.scrollHeight;
        };

        const renderViewContent = () => {

                    </div>

                    <div id="modal-conta-detalhes" class="fixed inset-0 modal-overlay z-50 flex items-center justify-center hidden opacity-0 transition-opacity" role="dialog" aria-modal="true" aria-labelledby="conta-detalhes-titulo">
                        <div class="glass w-full max-w-2xl rounded-2xl p-6 border border-blue-500/30 transform scale-95 transition-transform max-h-[90vh] overflow-y-auto" id="modal-conta-detalhes-content">
                            <div class="flex justify-between items-center mb-4 border-b border-white/10 pb-3">

                            <div id="conta-detalhes-conteudo" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
                        </div>
                    </div>
                `;

                const contasScroller = content.querySelector('.finance-account-table-container');
                let dragStartX = 0;
                let initialScrollLeft = 0;
                contasScroller.addEventListener('pointerdown', (event) => {
                    if (event.pointerType !== 'mouse' || event.button !== 0 || event.target.closest('button, select, input, textarea, a')) return;
                    dragStartX = event.clientX;
                    initialScrollLeft = contasScroller.scrollLeft;
                    contasScroller.classList.add('is-dragging');
                    contasScroller.setPointerCapture(event.pointerId);
                });
                contasScroller.addEventListener('pointermove', (event) => {
                    if (contasScroller.hasPointerCapture(event.pointerId)) {
                        contasScroller.scrollLeft = initialScrollLeft - (event.clientX - dragStartX);
                    }
                });
                const stopContasDrag = () => contasScroller.classList.remove('is-dragging');
                contasScroller.addEventListener('pointerup', stopContasDrag);
                contasScroller.addEventListener('pointercancel', stopContasDrag);
                contasScroller.addEventListener('lostpointercapture', stopContasDrag);

                const searchInput = document.getElementById('contas-search');
                const normalizeSearch = (value) => String(value ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('pt-BR').trim();
                const filterContas = () => {
                    const term = normalizeSearch(searchInput.value);
                    let matches = 0;
                    document.querySelectorAll('#contas-table-body tr[data-search]').forEach(row => {
                        const matchesSearch = normalizeSearch(row.dataset.search).includes(term);
                        row.classList.toggle('hidden', !matchesSearch);
                        if (matchesSearch) matches++;
                    });
                    const noResults = document.getElementById('contas-no-results');
                    noResults.classList.toggle('hidden', !term || matches > 0 || state.data.contas.length === 0);
                };
                searchInput.addEventListener('input', () => {
                    state.contasSearch = searchInput.value;
                    filterContas();
                });
                filterContas();

                const modal = document.getElementById('modal-conta');
                const modalContent = document.getElementById('modal-conta-content');
                const detailsModal = document.getElementById('modal-conta-detalhes');
                const detailsModalContent = document.getElementById('modal-conta-detalhes-content');
                window.openModalConta = (id = null) => {
                    if (state.currentUser.role !== 'admin') {
                        showToast('Somente administradores podem cadastrar ou editar contas.', 'error');
                        return;
                    }
                    const form = document.getElementById('form-add-conta');
                    form.reset();
                    state.editingContaId = id;
                    const account = id ? state.data.contas.find(item => item.id === id) : null;
                    if (id && !account) {
                        state.editingContaId = null;
                        showToast('Não foi possível localizar a conta para edição.', 'error');
                        return;
                    }
                    if (account) {
                        document.getElementById('add-conta').value = account.conta || '';
                        document.getElementById('add-fonte').value = account.fonte || '';
                        document.getElementById('add-emenda').value = account.emenda || '';
                        document.getElementById('add-codigo').value = account.codigo || '';
                        document.getElementById('add-portaria').value = account.portaria || '';
                        document.getElementById('add-portaria-link').value = account.portariaLink || '';
                        document.getElementById('add-visa').value = account.visa || '';
                        document.getElementById('add-objeto').value = account.objeto || '';
                        document.getElementById('add-utilizacao').value = account.utilizacao || '';
                    }
                    document.querySelector('#modal-conta-content h3').textContent = account ? 'Editar Conta SMS' : 'Adicionar Conta SMS';
                    form.querySelector('button[type="submit"]').textContent = account ? 'Salvar alterações' : 'Salvar Conta';
                    modal.classList.remove('hidden');
                    setTimeout(() => { modal.classList.remove('opacity-0'); modalContent.classList.remove('scale-95'); }, 10);
                };
                window.closeModalConta = () => {
                    state.editingContaId = null;
                    modal.classList.add('opacity-0'); modalContent.classList.add('scale-95');
                    setTimeout(() => {
                        modal.classList.add('hidden');
                        document.getElementById('form-add-conta').reset();
                        document.querySelector('#modal-conta-content h3').textContent = 'Adicionar / Editar Conta SMS';
                        document.querySelector('#form-add-conta button[type="submit"]').textContent = 'Salvar Conta';

                };
                window.openDetalhesConta = (id) => {
                    const conta = state.data.contas.find(item => item.id === id);
                    if (!conta) {
                        showToast('Não foi possível localizar os detalhes desta conta.', 'error');
                        return;
                    }

                    state.selectedContaId = id;
                    const safePortariaUrl = getSafeExternalUrl(conta.portariaLink);
                    const detalhes = [
                        ['Conta', conta.conta],
                        ['Fonte', conta.fonte],
                        ['Emenda / Repasse / Custeio', conta.emenda],
                        ['Código de aplicação', conta.codigo],
                        ['Portaria / Resolução / Deliberação', conta.portaria],
                        ['VISA', conta.visa],
                        ['Objeto', conta.objeto],
                        ['Possibilidades de utilização', conta.utilizacao]
                    ];
                    document.getElementById('conta-detalhes-conteudo').innerHTML = detalhes.map(([label, value]) => `
                        <div class="glass-card p-3 ${label === 'Portaria / Resolução / Deliberação' || label === 'Possibilidades de utilização' || label === 'Objeto' ? 'sm:col-span-2' : ''}">
                            <p class="text-xs font-semibold uppercase tracking-wide text-gray-400 mb-1">${escapeHtml(label)}</p>
                            <p class="text-sm text-white whitespace-pre-line break-words">${escapeHtml(value || '-')}</p>
                            ${label === 'Portaria / Resolução / Deliberação' && safePortariaUrl ? `<a href="${escapeHtml(safePortariaUrl)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 mt-3 text-blue-300 hover:text-blue-200 underline text-sm"><i class="fas fa-external-link-alt" aria-hidden="true"></i>Consultar portaria / resolução</a>` : ''}
                        </div>
                    `).join('');
                    detailsModal.classList.remove('hidden');
                    setTimeout(() => { detailsModal.classList.remove('opacity-0'); detailsModalContent.classList.remove('scale-95'); }, 10);
                };
                window.closeDetalhesConta = () => {
                    state.selectedContaId = null;
                    detailsModal.classList.add('opacity-0');
                    detailsModalContent.classList.add('scale-95');
                    setTimeout(() => detailsModal.classList.add('hidden'), 300);
                };
                content.querySelectorAll('.open-account-details').forEach(button => {
                    button.addEventListener('click', () => window.openDetalhesConta(button.dataset.accountId));
                });
                content.querySelectorAll('.edit-account').forEach(button => {
                    button.addEventListener('click', () => window.openModalConta(button.dataset.accountId));
                });

                window.deleteConta = async (id) => {
                    try {
                        await deleteFromDatabase(id, 'conta');
                        await logAction(`Excluiu conta SMS ID: ${id}`);
                        showToast('Lançamento excluído da nuvem!', 'success');
                    } catch (error) {
                        console.error('Erro ao excluir conta da nuvem:', error);
                        showToast('Não foi possível excluir a conta da nuvem.', 'error');
                    }
                };

                const form = document.getElementById('form-add-conta');
                if (form) {
                    form.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const portariaLink = document.getElementById('add-portaria-link').value.trim();
                        if (portariaLink && !getSafeExternalUrl(portariaLink)) {
                            showToast('Informe um link válido começando com http:// ou https://.', 'error');
                            return;
                        }
                        const contaData = {
                            conta: document.getElementById('add-conta').value,
                            fonte: document.getElementById('add-fonte').value,
                            emenda: document.getElementById('add-emenda').value,
                            codigo: document.getElementById('add-codigo').value,
                            portaria: document.getElementById('add-portaria').value,
                            portariaLink,
                            visa: document.getElementById('add-visa').value,
                            objeto: document.getElementById('add-objeto').value,
                            utilizacao: document.getElementById('add-utilizacao').value
                        };
                        try {
                            if (state.editingContaId) {
                                const editedId = state.editingContaId;
                                await updateContaInDatabase(editedId, contaData);
                                await logAction(`Editou conta SMS: ${contaData.conta}`);
                                showToast('Conta atualizada com sucesso!', 'success');
                            } else {
                                await saveToDatabase({ type: 'conta', ...contaData, createdAt: 'serverTimestamp' });
                                await logAction(`Adicionou nova conta SMS: ${contaData.conta}`);
                                showToast('Conta adicionada com sucesso!', 'success');
                            }
                            window.closeModalConta();
                        } catch (err) {
                            console.error('Erro ao salvar conta:', err);
                            showToast('Não foi possível salvar as alterações da conta. Verifique a conexão e as permissões.', 'error');
                        }
                    });
                }
                if (state.editingContaId) window.openModalConta(state.editingContaId);
                if (state.selectedContaId) window.openDetalhesConta(state.selectedContaId);
            } else if (state.currentView === 'receitas') {
                const canEditReceitas = state.currentUser.role === 'admin' || state.currentUser.canEditReceitas === true;

                            ${dayVacations.map(item => {

                            }).join('')}
                        </div>
                    `);
                }
                const employeeOptions = employees.map(employee => `<option value="${escapeHtml(employee.id)}" ${selectedEmployeeId === employee.id ? 'selected' : ''}>${escapeHtml(employee.nome)}${employee.matricula ? ` · ${escapeHtml(employee.matricula)}` : ''}</option>`).join('');
                const selectedEmployee = employees.find(item => item.id === selectedEmployeeId);
                const balanceRecords = state.data.ferias
                    .filter(item => item.anoReferencia === Number(selectedYear) && (!selectedEmployeeId || item.funcionarioId === selectedEmployeeId))
                    .sort((a, b) => {
                        const nameA = employees.find(person => person.id === a.funcionarioId)?.nome || '';
                        const nameB = employees.find(person => person.id === b.funcionarioId)?.nome || '';
                        return nameA.localeCompare(nameB, 'pt-BR');
                    });
                const balanceEmployees = (selectedEmployee ? [selectedEmployee] : employees).map(employee => ({
                    employee,
                    record: balanceRecords.find(item => item.funcionarioId === employee.id)
                }));
                const inclusiveDays = (start, end) => {

                    const first = new Date(`${start}T00:00:00`);
                    const last = new Date(`${end}T00:00:00`);
                    return Number.isNaN(first.getTime()) || Number.isNaN(last.getTime()) || last < first
                        ? 0
                        : Math.floor((last - first) / 86400000) + 1;
                };

                const fileInput = document.getElementById('protocol-file');

                const getSourceYear = record => record.ano && /^\d{4}$/.test(String(record.ano)) ? String(record.ano) : 'sem-ano';
                const deleteProtocolRecords = async (records, type) => {
                    if (state.currentUser?.role !== 'admin') throw new Error('Apenas administradores podem excluir registros de Protocolos.');
                    if (state.useLocalFallback) {
                        const localData = JSON.parse(localStorage.getItem('sys_data') || '{}');

                        localStorage.setItem('sys_data', JSON.stringify(localData));
                    } else {
                        for (let start = 0; start < records.length; start += 450) {
                            const batch = writeBatch(db);
                            records.slice(start, start + 450).forEach(record => {
                                batch.delete(doc(db, 'artifacts', appId, 'data', record.id));
                            });
                            await batch.commit();
                        }
                    }
                    if (type === 'protocolo') {
                        const deletedIds = new Set(records.map(record => record.id));
                        state.data.protocolos = (state.data.protocolos || []).filter(record => !deletedIds.has(record.id));
                    } else {
                        const deletedIds = new Set(records.map(record => record.id));
                        state.data.protocoloFonte = (state.data.protocoloFonte || []).filter(record => !deletedIds.has(record.id));
                        state.protocolSelectedSourceIds = (state.protocolSelectedSourceIds || []).filter(id => !deletedIds.has(id));

                    }
                    refreshViewForDataChanges(new Set([type]));
                };
                const sourceYearSelect = document.getElementById('protocol-source-year');

                        state.protocolSourceYear = sourceYearSelect.value;
                    });
                }
                const deleteSourceYear = (year, label) => {

                    if (!records.length) {
                        showToast(`Não há registros importados ${label}.`, 'info');

                    }
                    if (!window.confirm(`Excluir permanentemente ${records.length} registro(s) da base importada ${label}?`)) return;

                document.getElementById('protocol-history-year')?.addEventListener('change', event => {

                document.getElementById('protocol-delete-year')?.addEventListener('click', async event => {

                        showToast('Selecione 2026, 2027 ou Sem ano antes de excluir em lote.', 'error');

                    const records = protocols.filter(protocol => getProtocolYear(protocol) === year);

                        showToast(`Não há protocolos para excluir em ${year === 'sem-ano' ? 'registros antigos sem ano' : year}.`, 'info');
                        return;
                    }
                    const yearLabel = year === 'sem-ano' ? 'registros antigos sem ano' : year;
                    if (!window.confirm(`Excluir permanentemente ${records.length} protocolo(s) de ${yearLabel}?`)) return;

                        await deleteProtocolRecords([protocol], 'protocolo');
                        await logAction(`Excluiu o protocolo nº ${protocol.protocoloNumero}`);

                const updateProtocolSelectionSummary = () => {
                    const selected = rows.filter(item => selectedSourceIds.includes(item.id));

                fileInput.addEventListener('change', async event => {

                    try {
                        const workbook = window.XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const grid = window.XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                        if (!grid.length) {
                            showToast('A planilha está vazia.', 'error');
                            return;
                        }
                        const preferredProtocolValueHeaders = ['liquidadoapagar', 'valorliquidadoapagar', 'valorliquidoapagar', 'vlrliquidadoapagar'];

                            ['fornecedor', 'Fornecedor (Credor)', ['fornecedor', 'credor', 'favorecido', 'razaosocial']],

                                return;

                                const read = key => mapping[key] === null ? '' : row[mapping[key]];

                                const selectedValues = Object.fromEntries(['fornecedor', 'valor', 'empenho', 'liquidacao'].map(key => [key, normalizeHeader(read(key))]));

                                    fornecedor: ['fornecedor', 'credor', 'favorecido', 'razaosocial'],

                                const skippedCount = state.protocolImport.rawRows.length - imported.length;

                                showToast(`Relatório importado com sucesso. ${imported.length} registro(s) salvo(s)${skippedCount ? `; ${skippedCount} linha(s) inválida(s) ignorada(s)` : ''}.`, 'success');
                                refreshViewForDataChanges(new Set(['protocoloFonte']));
                            } catch (error) {

                            }

                content.querySelectorAll('[data-edit-recipes-user]').forEach(input => {

                        input.disabled = true;

                            await logAction(`${input.checked ? 'Liberou' : 'Removeu'} edição de receitas para ${input.dataset.editRecipesUser}`);
                            showToast('Permissão de edição atualizada.', 'success');

                            input.checked = !input.checked;
                            console.error('Erro ao salvar permissão de edição de receitas:', error);
                            showToast('Não foi possível atualizar a permissão do usuário.', 'error');
                        } finally {
                            input.disabled = false;
                        }
                    });
                });
                content.querySelectorAll('[data-edit-vacations-user]').forEach(input => {
                    input.addEventListener('change', async () => {
                        input.disabled = true;
                        try {
                            await updateUserPermission(input.dataset.userId, input.dataset.editVacationsUser, 'canEditFerias', input.checked);
                            await logAction(`${input.checked ? 'Liberou' : 'Removeu'} edição do Controle de Férias para ${input.dataset.editVacationsUser}`);
                            showToast('Permissão de edição de férias atualizada.', 'success');
                        } catch (error) {
                            input.checked = !input.checked;
                            console.error('Erro ao salvar permissão de edição do Controle de Férias:', error);
                            showToast('Não foi possível atualizar a permissão do usuário.', 'error');
                        } finally {
                            input.disabled = false;
                        }
                    });
                });

                const modal = document.getElementById('modal-user');
                const modalContent = document.getElementById('modal-user-content');
                let selectedAccessRequestId = null;
                window.openModalUser = () => {
                    modal.classList.remove('hidden');
                    setTimeout(() => { modal.classList.remove('opacity-0'); modalContent.classList.remove('scale-95'); }, 10);
                };
                window.closeModalUser = () => {
                    modal.classList.add('opacity-0'); modalContent.classList.add('scale-95');
                    setTimeout(() => { modal.classList.add('hidden'); document.getElementById('form-add-user').reset(); }, 300);
                    selectedAccessRequestId = null;
                    document.querySelector('#modal-user h3').textContent = 'Adicionar Novo Usuário';
                };
                window.approveAccessRequest = (requestId) => {
                    const request = state.data.accessRequests.find(item => item.id === requestId);
                    if (!request) return;
                    selectedAccessRequestId = requestId;
                    document.getElementById('user-name').value = request.name;
                    document.getElementById('user-username').value = request.username || (request.email?.split('@')[0] || request.name)
                        .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9._-]/g, '');
                    document.getElementById('user-role').value = 'user';
                    document.getElementById('user-pass').value = request.temporaryPassword || '';
                    document.querySelector('#modal-user h3').textContent = 'Aprovar Solicitação de Acesso';
                    window.openModalUser();
                };
                window.rejectAccessRequest = async (requestId) => {
                    try {
                        await deleteFromDatabase(requestId, 'accessRequest');
                        await logAction(`Rejeitou solicitação de acesso ID ${requestId}`);
                        showToast('Solicitação rejeitada.', 'success');
                    } catch (error) {
                        showToast('Erro ao rejeitar solicitação.', 'error');
                    }
                };
                window.deleteUser = async (userIdOrName) => {
                    const user = state.data.users.find(item => item.id === userIdOrName || item.username === userIdOrName);
                    if (!user) {
                        showToast('Usuário não encontrado. Atualize a página e tente novamente.', 'error');
                        return;
                    }
                    try {
                        await deleteFromDatabase(user.id, 'user');
                        await logAction(`Excluiu o usuário: ${user.username}`);
                        showToast('Usuário excluído da nuvem.', 'success');
                    } catch (error) {
                        console.error('Erro ao excluir usuário:', error);
                        showToast('Não foi possível excluir o usuário. Verifique a conexão e as permissões.', 'error');
                    }
                };

                const form = document.getElementById('form-add-user');
                if (form) {
                    form.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const uname = document.getElementById('user-username').value.trim().toLowerCase();
                        const name = document.getElementById('user-name').value;
                        const role = document.getElementById('user-role').value;
                        const pass = document.getElementById('user-pass').value;
                        const accessRequest = selectedAccessRequestId
                            ? state.data.accessRequests.find(request => request.id === selectedAccessRequestId)
                            : null;

                        const allUsers = state.data.users;
                        if (allUsers.some(u => u.username === uname)) {
                            showToast('Nome de usuário já existe na nuvem!', 'error');
                            return;
                        }

                        const newUserObj = {
                            type: 'user',
                            username: uname,
                            password: pass,
                            role: role,
                            name: name,
                            canEditReceitas: false,
                            canEditFerias: false,
                            ...(accessRequest ? { sector: accessRequest.sector } : {})
                        };

                        try {
                            await saveToDatabase(newUserObj);
                            if (accessRequest) {
                                await deleteFromDatabase(accessRequest.id, 'accessRequest');
                                await logAction(`Aprovou solicitação e criou usuário: ${uname}`);
                                showToast('Solicitação aprovada e usuário criado!', 'success');
                            } else {
                                await logAction(`Adicionou novo usuário na nuvem: ${uname}`);
                                showToast('Usuário adicionado com sucesso na nuvem!', 'success');
                            }
                            window.closeModalUser();
                        } catch(err) {
                            showToast('Erro ao salvar usuário.', 'error');
                        }
                    });
                }
            }
        };

        // ==========================================
        //  LÓGICA AUDITORIA FISCAL (Adaptada p/ Window)
        // ==========================================
        
        window.switchAuditoriaView = (v) => {
            document.getElementById('view-calculadora-auditoria').classList.add('hidden');
            document.getElementById('view-configuracoes-auditoria').classList.add('hidden');
            document.getElementById('nav-calc-auditoria').className = "bg-white/5 hover:bg-white/10 text-gray-300 font-semibold py-2 px-4 rounded-lg transition-colors text-sm border border-white/10";
            document.getElementById('nav-cfg-auditoria').className = "bg-white/5 hover:bg-white/10 text-gray-300 font-semibold py-2 px-4 rounded-lg transition-colors text-sm border border-white/10";
            document.getElementById(`view-${v}-auditoria`).classList.remove('hidden');
            document.getElementById(`nav-${v === 'calculadora' ? 'calc' : 'cfg'}-auditoria`).className = "bg-purple-600 hover:bg-purple-500 text-white font-semibold py-2 px-4 rounded-lg shadow-lg transition-colors flex items-center gap-2 text-sm border border-purple-400/50";
        };

        window.arredondarValor = (v) => Math.round((v + Math.sign(v) * Number.EPSILON) * 100) / 100;
        window.formatBRL = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        window.formatNum = (v, d = 2) => v.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
        window.formatToMask = (valStr) => {
            if (!valStr) return '';
            let val = parseInt(valStr, 10); if (isNaN(val)) return '';
            let str = (val / 100).toFixed(2).replace('.', ',');
            return str.replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1.');
        };
        window.formatInputOnBlurOrEnter = (e) => {
            if(e.type === 'keydown' && e.key !== 'Enter') return;
            let raw = e.target.value.replace(/[^\d.,]/g, ''); if(!raw) return;
            if(!raw.includes(',') && !raw.includes('.')) e.target.value = window.formatToMask(raw + '00');
            else { let num = parseFloat(raw.replace(/\./g, '').replace(',', '.')); if(!isNaN(num)) e.target.value = num.toFixed(2).replace('.', ',').replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1.'); }
        };
        window.parseCurrency = (str) => { if (!str) return 0; return parseFloat(str.replace(/\./g, '').replace(',', '.')) || 0; };
        window.getNumVal = (id) => window.parseCurrency(document.getElementById(id).value);
        window.setCurrencyVal = (id, value) => {
            const el = document.getElementById(id);
            if(el) { if(value === 0) el.value = '0,00'; else el.value = value.toFixed(2).replace('.', ',').replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1.'); }
        };

        window.switchSettingsTab = (tab) => {
            ['prev', 'irpf', 'reinf', 'conferidor'].forEach(t => {
                document.getElementById(`cfg-${t}-section`).classList.add('hidden');
                document.getElementById(`tab-${t}`).className = "pb-3 px-3 font-semibold text-gray-400 border-b-2 border-transparent hover:text-purple-400 transition-colors whitespace-nowrap";
            });
            document.getElementById(`cfg-${tab}-section`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = "pb-3 px-3 font-semibold text-purple-400 border-b-2 border-purple-400 transition-colors whitespace-nowrap";
        };

        window.populateSelect = (id, arr) => {
            const s = document.getElementById(id); if (!s) return;
            const cv = s.value; s.innerHTML = '';
            arr.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = `${v.toFixed(2).replace('.', ',')}%`; s.appendChild(o); });
            if(Array.from(s.options).some(o => o.value === cv)) s.value = cv;
        };

        window.populateClassificacoesDropdowns = () => {
            const dp = document.getElementById('dropdown-class-pf'); const dj = document.getElementById('dropdown-class-pj');
            if(dp) dp.innerHTML = ''; if(dj) dj.innerHTML = '';
            const g = {}; const prio = [];
            window.auditoriaSystemRates.irrfNaturezas.forEach(i => { if(i.prioridade) prio.push(i); else { if(!g[i.grupo]) g[i.grupo] = []; g[i.grupo].push(i); } });

            const buildItem = (i, t, isP) => `<div class="cursor-pointer px-4 py-2 text-sm hover:bg-purple-900/30 text-white border-b border-white/5 last:border-0 drop-item transition-colors" data-value="${i.codigo}" data-label="${isP?'⭐ ':''}${i.codigo} - ${i.descricao}" data-search="${i.codigo.toLowerCase()} ${i.descricao.toLowerCase()}" ${t==='pj'&&i.aliquotaPj!=null?`data-aliquota="${i.aliquotaPj}"`:''} onclick="window.selectClassification('${t}', this)">${isP?'⭐ ':''}${i.codigo} - ${i.descricao}</div>`;
            const buildHead = (l) => `<div class="px-3 py-1.5 text-[10px] font-bold text-gray-400 bg-black/40 uppercase sticky top-0">${l}</div>`;

            let hp = '', hj = '';
            if (prio.length > 0) {
                let pp='', pjj='';
                prio.forEach(i => { if(i.aplicacao==='PF'||i.aplicacao==='Ambos') pp+=buildItem(i,'pf',true); if(i.aplicacao==='PJ'||i.aplicacao==='Ambos') pjj+=buildItem(i,'pj',true); });
                if(pp) hp += buildHead('Prioritárias') + pp; if(pjj) hj += buildHead('Prioritárias') + pjj;
            }
            Object.keys(g).sort().forEach(n => {
                let gp='', gj='';
                g[n].forEach(i => { if(i.aplicacao==='PF'||i.aplicacao==='Ambos') gp+=buildItem(i,'pf',false); if(i.aplicacao==='PJ'||i.aplicacao==='Ambos') gj+=buildItem(i,'pj',false); });
                if(gp) hp += buildHead(n) + gp; if(gj) hj += buildHead(n) + gj;
            });

            if(dp) dp.innerHTML = hp || '<div class="p-3 text-sm text-gray-500 text-center">Nenhuma disponível.</div>';
            if(dj) dj.innerHTML = hj || '<div class="p-3 text-sm text-gray-500 text-center">Nenhuma disponível.</div>';
        };

        window.selectClassification = (t, e) => {
            document.getElementById(`search-class-${t}`).value = e.dataset.label; document.getElementById(`calc-classificacao-${t}`).value = e.dataset.value;
            document.getElementById(`dropdown-class-${t}`).classList.add('hidden');
            if(t==='pj') { document.getElementById('calc-aliq-irrf-pj').value = (e.dataset.aliquota !== undefined && e.dataset.aliquota !== "") ? parseFloat(e.dataset.aliquota).toFixed(2).replace('.', ',') : ""; }
            window.calculateAll();
        };

        window.setupDropdownListeners = (t) => {
            const inp = document.getElementById(`search-class-${t}`), dd = document.getElementById(`dropdown-class-${t}`), w = document.getElementById(`wrap-class-${t}`);
            if(!inp) return;
            inp.addEventListener('focus', (e) => { dd.classList.remove('hidden'); e.target.select(); window.filterDropdown(t, inp.value); });
            inp.addEventListener('input', (e) => { dd.classList.remove('hidden'); window.filterDropdown(t, e.target.value); if(e.target.value.trim()==='') { document.getElementById(`calc-classificacao-${t}`).value=''; if(t==='pj') document.getElementById('calc-aliq-irrf-pj').value=''; window.calculateAll(); } });
            document.addEventListener('click', (e) => { if(!w.contains(e.target)) { dd.classList.add('hidden'); if(!document.getElementById(`calc-classificacao-${t}`).value) inp.value=''; } });
        };
        window.filterDropdown = (t, txt) => { const term = txt.toLowerCase().trim(); document.querySelectorAll(`#dropdown-class-${t} .drop-item`).forEach(i => i.style.display = i.dataset.search.includes(term) ? 'block' : 'none'); };

        window.loadSettingsInputs = () => {
            const p = window.auditoriaSystemRates.previdencia, r = window.auditoriaSystemRates.irpfReducao;
            document.getElementById('cfg-prev-pf-nao-inss').value = p.pfNaoProdutor.inss.join(', '); document.getElementById('cfg-prev-pj-nao-inss').value = p.pjNaoProdutor.inss.join(', ');
            document.getElementById('cfg-prev-pf-prod-inss').value = p.pfProdutor.inss.join(', '); document.getElementById('cfg-prev-pf-prod-senar').value = p.pfProdutor.senar.join(', '); document.getElementById('cfg-prev-pf-prod-gilrat').value = p.pfProdutor.gilrat.join(', ');
            document.getElementById('cfg-prev-pj-prod-inss').value = p.pjProdutor.inss.join(', '); document.getElementById('cfg-prev-pj-prod-senar').value = p.pjProdutor.senar.join(', '); document.getElementById('cfg-prev-pj-prod-gilrat').value = p.pjProdutor.gilrat.join(', ');
            document.getElementById('cfg-desc-simplificado').value = r.descontoSimplificado.toFixed(2); document.getElementById('cfg-reducao-isencao').value = r.limiteIsencao.toFixed(2);
            document.getElementById('cfg-reducao-parcial').value = r.limiteParcial.toFixed(2); document.getElementById('cfg-reducao-fixa').value = r.parcelaFixa.toFixed(2); document.getElementById('cfg-reducao-mult').value = r.fatorMult.toFixed(4);
        };
        window.renderIRPFTableConfig = () => {
            const c = document.getElementById('irpf-config-container'); c.innerHTML = '';
            window.auditoriaSystemRates.irpfTabela.forEach((r, i) => {
                c.innerHTML += `<div class="grid grid-cols-2 gap-4"><input type="text" id="irpf-cap-${i}" class="w-full p-2 glass-input rounded text-sm" value="${r.capacidade ? r.capacidade.toFixed(2) : ''}" placeholder="${i===window.auditoriaSystemRates.irpfTabela.length-1?'O Restante':'0.00'}"><input type="text" id="irpf-aliq-${i}" class="w-full p-2 glass-input rounded text-sm" value="${r.aliq.toFixed(2)}"></div>`;
            });
        };
        window.renderGruposConfig = () => {
            const c = document.getElementById('grupos-config-container'); c.innerHTML = '';
            window.auditoriaSystemRates.irrfGrupos.forEach((g, i) => {
                c.innerHTML += `<div class="flex gap-2 items-center bg-black/20 border border-white/10 p-2 rounded"><input type="text" class="w-full p-1.5 text-sm bg-transparent outline-none text-white" value="${g}" onchange="window.updateGroup(${i}, this.value)"><button onclick="window.removeGroup(${i})" class="text-gray-400 hover:text-red-400"><i class="fas fa-trash"></i></button></div>`;
            });
        };

        let auditoriaSaveQueue = Promise.resolve();
        window.persistAuditoriaRates = async (showSuccess = false) => {
            const snapshot = JSON.parse(JSON.stringify(window.auditoriaSystemRates));
            const pendingSave = auditoriaSaveQueue.catch(() => {}).then(() => setDoc(doc(db, 'artifacts', appId, 'config', 'taxAuditor'), snapshot));
            auditoriaSaveQueue = pendingSave;
            try {
                await pendingSave;
                try { localStorage.setItem('auditoriaSystemRates', JSON.stringify(snapshot)); } catch (error) {}
                if (showSuccess) showToast('Configurações salvas na nuvem!', 'success');
                return true;
            } catch (error) {
                console.error('Erro ao salvar configurações fiscais na nuvem:', error);
                try { localStorage.setItem('auditoriaSystemRates', JSON.stringify(snapshot)); } catch (storageError) {}
                showToast('Erro ao salvar na nuvem. Alterações mantidas apenas neste dispositivo.', 'error');
                return false;
            }
        };

        window.addGroup = () => { window.auditoriaSystemRates.irrfGrupos.push("Novo Grupo"); window.renderGruposConfig(); window.renderReinfConfig(); window.persistAuditoriaRates(); };
        window.updateGroup = (i, v) => { const old = window.auditoriaSystemRates.irrfGrupos[i]; window.auditoriaSystemRates.irrfGrupos[i] = v; window.auditoriaSystemRates.irrfNaturezas.forEach(n => { if(n.grupo===old) n.grupo=v; }); window.renderGruposConfig(); window.renderReinfConfig(); window.persistAuditoriaRates(); };
        window.removeGroup = (i) => { if(confirm('Excluir grupo?')) { window.auditoriaSystemRates.irrfGrupos.splice(i,1); window.renderGruposConfig(); window.renderReinfConfig(); window.persistAuditoriaRates(); } };
        
        window.renderReinfConfig = () => {
            const c = document.getElementById('reinf-config-container'); c.innerHTML = '';
            window.auditoriaSystemRates.irrfNaturezas.forEach(i => {
                c.innerHTML += `<div class="grid grid-cols-12 gap-2 items-center bg-black/20 p-1.5 rounded border border-white/5 hover:bg-white/5"><div class="col-span-1 text-center"><button onclick="window.togglePriority('${i.id}')" class="${i.prioridade?'text-yellow-400':'text-gray-500'}"><i class="fas fa-star"></i></button></div><div class="col-span-2"><select class="w-full p-1 glass-input rounded text-xs" onchange="window.updateReinfItem('${i.id}', 'grupo', this.value)">${window.auditoriaSystemRates.irrfGrupos.map(g=>`<option ${g===i.grupo?'selected':''}>${g}</option>`).join('')}</select></div><div class="col-span-2"><input class="w-full p-1 glass-input rounded text-xs" value="${i.codigo}" onchange="window.updateReinfItem('${i.id}', 'codigo', this.value)"></div><div class="col-span-3"><input class="w-full p-1 glass-input rounded text-xs" value="${i.descricao}" onchange="window.updateReinfItem('${i.id}', 'descricao', this.value)"></div><div class="col-span-2"><select class="w-full p-1 glass-input rounded text-xs" onchange="window.updateReinfItem('${i.id}', 'aplicacao', this.value)"><option value="PF" ${i.aplicacao==='PF'?'selected':''}>PF</option><option value="PJ" ${i.aplicacao==='PJ'?'selected':''}>PJ</option><option value="Ambos" ${i.aplicacao==='Ambos'?'selected':''}>Ambos</option></select></div><div class="col-span-1"><input class="w-full p-1 glass-input rounded text-xs text-right" value="${i.aliquotaPj!=null?parseFloat(i.aliquotaPj).toFixed(2).replace('.',','):''}" onchange="window.updateReinfItem('${i.id}', 'aliquotaPj', this.value)"></div><div class="col-span-1 text-center"><button onclick="window.removeReinfItem('${i.id}')" class="text-gray-400 hover:text-red-400"><i class="fas fa-trash"></i></button></div></div>`;
            });
        };
        window.togglePriority = (id) => { const n = window.auditoriaSystemRates.irrfNaturezas.find(x=>x.id===id); if(n) { n.prioridade = !n.prioridade; window.renderReinfConfig(); window.persistAuditoriaRates(); } };
        window.updateReinfItem = (id, f, v) => { const n = window.auditoriaSystemRates.irrfNaturezas.find(x=>x.id===id); if(n) { if(f==='aliquotaPj') n[f] = v.trim()===""?null:(parseFloat(v.replace(',','.'))||0); else n[f]=v; window.persistAuditoriaRates(); } };
        window.addReinfItem = () => { window.auditoriaSystemRates.irrfNaturezas.unshift({ id: 'n_'+Date.now(), grupo: window.auditoriaSystemRates.irrfGrupos[0]||'Geral', codigo:'', descricao:'Nova', aplicacao:'Ambos', aliquotaPj:null, prioridade:false }); window.renderReinfConfig(); window.persistAuditoriaRates(); };
        window.removeReinfItem = (id) => { if(confirm('Excluir?')) { window.auditoriaSystemRates.irrfNaturezas = window.auditoriaSystemRates.irrfNaturezas.filter(x=>x.id!==id); window.renderReinfConfig(); window.persistAuditoriaRates(); } };

        window.renderConferidoresConfig = () => {
            const tb = document.getElementById('tbody-conferidores'), sel = document.getElementById('calc-conferidor');
            if(tb) tb.innerHTML = ''; if(sel) { const cv = sel.value; sel.innerHTML = '<option value="">Selecione um responsável...</option>'; window.auditoriaSystemRates.conferidores.forEach(c => sel.innerHTML += `<option value="${c.nome} - ${c.matricula}">${c.nome} - ${c.matricula}</option>`); sel.value = cv; }
            window.auditoriaSystemRates.conferidores.forEach(c => { if(tb) tb.innerHTML += `<tr><td class="p-3">${c.nome}</td><td class="p-3">${c.matricula}</td><td class="p-3 text-center"><button onclick="window.removeConferidor('${c.id}')" class="text-gray-400 hover:text-red-400"><i class="fas fa-trash"></i></button></td></tr>`; });
        };
        window.addConferidor = () => { const n = document.getElementById('cfg-conf-nome').value, m = document.getElementById('cfg-conf-mat').value; if(n) { window.auditoriaSystemRates.conferidores.push({id:'c_'+Date.now(), nome:n, matricula:m}); document.getElementById('cfg-conf-nome').value=''; document.getElementById('cfg-conf-mat').value=''; window.renderConferidoresConfig(); window.persistAuditoriaRates(); } };
        window.removeConferidor = (id) => { window.auditoriaSystemRates.conferidores = window.auditoriaSystemRates.conferidores.filter(x=>x.id!==id); window.renderConferidoresConfig(); window.persistAuditoriaRates(); };

        window.toggleIncidencia = (id) => { const c = document.getElementById(`nao-incide-${id}`), a = document.getElementById(`area-${id}`); if(c.checked) { a.classList.add('area-desativada'); ['prev','iss','irrf-pf','irrf-pj'].forEach(x => { if(id===x) document.getElementById(`calc-base-${x}`).value=''; }); } else a.classList.remove('area-desativada'); window.calculateAll(); };
        window.handleSimplesChange = () => { const s = document.getElementById('calc-simples-nacional').checked, sec = document.getElementById('section-irrf-pj'), b = document.getElementById('badge-simples-pj'); if(s) { sec.classList.add('opacity-50','pointer-events-none'); b.classList.remove('hidden'); document.getElementById('nao-incide-irrf-pj').checked=true; } else { sec.classList.remove('opacity-50','pointer-events-none'); b.classList.add('hidden'); } window.toggleIncidencia('irrf-pj'); };
        window.handleContribuinteChange = () => {
            const t = document.querySelector('input[name="tipo_contribuinte"]:checked').value, r = document.getElementById('check-produtor-rural').checked, p = window.auditoriaSystemRates.previdencia;
            document.getElementById('wrap-simples-nacional').classList.toggle('hidden', t==='fisica');
            document.getElementById('section-irrf-pf').classList.toggle('hidden', t==='juridica'); document.getElementById('section-irrf-pf').classList.toggle('flex', t==='fisica');
            document.getElementById('section-irrf-pj').classList.toggle('hidden', t==='fisica'); document.getElementById('section-irrf-pj').classList.toggle('flex', t==='juridica');
            document.getElementById('calc-aliq-senar').disabled = !r; document.getElementById('calc-aliq-gilrat').disabled = !r;
            if(t==='fisica' && !r) { window.populateSelect('calc-aliq-inss', p.pfNaoProdutor.inss); window.populateSelect('calc-aliq-senar', [0]); window.populateSelect('calc-aliq-gilrat', [0]); }
            else if(t==='juridica' && !r) { window.populateSelect('calc-aliq-inss', p.pjNaoProdutor.inss); window.populateSelect('calc-aliq-senar', [0]); window.populateSelect('calc-aliq-gilrat', [0]); }
            else if(t==='fisica' && r) { window.populateSelect('calc-aliq-inss', p.pfProdutor.inss); window.populateSelect('calc-aliq-senar', p.pfProdutor.senar); window.populateSelect('calc-aliq-gilrat', p.pfProdutor.gilrat); }
            else { window.populateSelect('calc-aliq-inss', p.pjProdutor.inss); window.populateSelect('calc-aliq-senar', p.pjProdutor.senar); window.populateSelect('calc-aliq-gilrat', p.pjProdutor.gilrat); }
            window.handleSimplesChange();
        };

        window.calcularIRPFFaixas = (bb, bf) => {
            let tot = 0, fx = [], res = bf;
            window.auditoriaSystemRates.irpfTabela.forEach((f, i) => {
                let cap = f.capacidade===null ? Infinity : f.capacidade, bnx = 0;
                if(res>0) { if(res>=cap) { bnx=cap; res=Math.round((res-cap)*100)/100; } else { bnx=res; res=0; } }
                let v = window.arredondarValor(bnx*f.aliq/100); tot+=v;
                fx.push({ nome: (i+1)+"ª Faixa", base: bnx, aliq: f.aliq, imposto: v });
            });
            let irb = window.arredondarValor(tot), red = 0, r = window.auditoriaSystemRates.irpfReducao;
            if(bb>0) { if(bb<=r.limiteIsencao) red=irb; else if(bb<=r.limiteParcial) { red = window.arredondarValor(r.parcelaFixa-((r.fatorMult/100)*bb)); if(red<0) red=0; if(red>irb) red=irb; } }
            return { irBruto: irb, redutor: red, irFinal: Math.max(0, irb-red), faixasCalc: fx };
        };

        window.calculateAll = () => {
            const vnf = window.getNumVal('calc-valor-nf'), t = document.querySelector('input[name="tipo_contribuinte"]:checked').value, r = document.getElementById('check-produtor-rural').checked;
            const np = document.getElementById('nao-incide-prev').checked, ni = document.getElementById('nao-incide-iss').checked, npf = document.getElementById('nao-incide-irrf-pf').checked, npj = document.getElementById('nao-incide-irrf-pj').checked;
            let totImp = 0, vInss = 0, vSenar = 0, vGilrat = 0, sPrev = 0, sAliq = 0;

            if(!np) {
                const b = window.getNumVal('calc-base-prev');
                const pi = parseFloat(document.getElementById('calc-aliq-inss').value)||0, ps = parseFloat(document.getElementById('calc-aliq-senar').value)||0, pg = parseFloat(document.getElementById('calc-aliq-gilrat').value)||0;
                vInss = window.arredondarValor(b*(pi/100)); if(r) { vSenar = window.arredondarValor(b*(ps/100)); vGilrat = window.arredondarValor(b*(pg/100)); }
                sAliq = pi+ps+pg; sPrev = vInss+vSenar+vGilrat; totImp += sPrev;
            }
            window.setCurrencyVal('calc-val-inss', vInss); window.setCurrencyVal('calc-val-senar', vSenar); window.setCurrencyVal('calc-val-gilrat', vGilrat);
            document.getElementById('display-soma-aliq-prev').value = sAliq.toFixed(2).replace('.',',')+'%'; window.setCurrencyVal('display-val-prev-input', sPrev); document.getElementById('display-val-prev-header').textContent = window.formatBRL(sPrev);
            document.getElementById('alerta-lancar-ret').classList.toggle('hidden', !(!np || (t==='fisica'&&!npf) || (t==='juridica'&&!npj)));

            let vIss = 0; if(!ni) { vIss = window.arredondarValor(window.getNumVal('calc-base-iss')*(window.getNumVal('calc-aliq-iss')/100)); totImp+=vIss; }
            document.getElementById('display-val-iss').textContent = window.formatBRL(vIss);

            if(t==='fisica') {
                let vIrrf = 0;
                if(!npf) {
                    const bb = window.getNumVal('calc-base-irrf-pf'), di = document.getElementById('calc-deducao-irrf-pf');
                    const dAuto = Math.max(sPrev, window.auditoriaSystemRates.irpfReducao.descontoSimplificado);
                    if(di.dataset.auto==="true") window.setCurrencyVal('calc-deducao-irrf-pf', dAuto);
                    const bcf = Math.max(0, bb - window.getNumVal('calc-deducao-irrf-pf')); document.getElementById('calc-base-calc-irrf-pf').value = window.formatNum(bcf);
                    const calc = window.calcularIRPFFaixas(bb, bcf);
                    document.getElementById('tbody-demonstrativo-irpf').innerHTML = calc.faixasCalc.map(f => `<tr><td class="px-2 py-1 flex justify-between border-r border-white/10"><span>${f.nome}</span><span>${window.formatNum(f.base)}</span></td><td class="px-2 py-1 text-center border-r border-white/10">${window.formatNum(f.aliq,1)}%</td><td class="px-2 py-1 text-right">${window.formatNum(f.imposto)}</td></tr>`).join('');
                    document.getElementById('dem-total-imposto').textContent = window.formatNum(calc.irBruto);
                    vIrrf = calc.irFinal; totImp+=vIrrf; document.getElementById('calc-aliq-efetiva-pf').value = window.formatNum(bb>0?(vIrrf/bb)*100:0) + '%';
                    window.setCurrencyVal('calc-redutor-irrf-pf', calc.redutor);
                } else { document.getElementById('calc-base-calc-irrf-pf').value='0,00'; document.getElementById('calc-aliq-efetiva-pf').value='0,00%'; document.getElementById('calc-redutor-irrf-pf').value='0,00'; document.getElementById('dem-total-imposto').textContent='0,00'; document.getElementById('tbody-demonstrativo-irpf').innerHTML=''; }
                document.getElementById('display-val-irrf-pf').textContent = window.formatBRL(vIrrf);
            }
            if(t==='juridica') {
                let vPj = 0; if(!npj) { const aq = document.getElementById('calc-aliq-irrf-pj').value; vPj = window.arredondarValor(window.getNumVal('calc-base-irrf-pj')*(parseFloat(aq.replace(',','.'))/100||0)); totImp+=vPj; }
                document.getElementById('display-val-irrf-pj').textContent = window.formatBRL(vPj);
            }
            const desc = window.getNumVal('calc-desconto'); document.getElementById('resumo-impostos').textContent = window.formatBRL(totImp); document.getElementById('resumo-liquido').textContent = window.formatBRL(Math.max(0, vnf-totImp-desc));
        };

        window.resetAuditoriaCalculator = () => {
            [
                'calc-valor-nf', 'search-class-pf', 'calc-classificacao-pf', 'calc-base-irrf-pf',
                'calc-deducao-irrf-pf', 'search-class-pj', 'calc-classificacao-pj', 'calc-base-irrf-pj',
                'calc-aliq-irrf-pj', 'calc-base-prev', 'calc-base-iss', 'calc-aliq-iss', 'calc-desconto'
            ].forEach(id => { document.getElementById(id).value = ''; });

            ['calc-aliq-inss', 'calc-aliq-senar', 'calc-aliq-gilrat'].forEach(id => {
                document.getElementById(id).value = '';
            });
            ['calc-base-prev', 'calc-base-iss', 'calc-base-irrf-pj', 'calc-base-irrf-pf'].forEach(id => {
                document.getElementById(id).dataset.synced = 'true';
            });
            document.getElementById('calc-deducao-irrf-pf').dataset.auto = 'true';
            document.getElementById('calc-conferidor').value = '';
            document.getElementById('check-produtor-rural').checked = false;
            document.getElementById('calc-simples-nacional').checked = false;
            document.querySelector('input[name="tipo_contribuinte"][value="juridica"]').checked = true;
            ['prev', 'iss', 'irrf-pf', 'irrf-pj'].forEach(id => {
                document.getElementById(`nao-incide-${id}`).checked = true;
                document.getElementById(`area-${id}`).classList.add('area-desativada');
            });
            ['pf', 'pj'].forEach(type => document.getElementById(`dropdown-class-${type}`).classList.add('hidden'));

            window.handleContribuinteChange();
            window.calculateAll();
        };

        window.salvarConfiguracoes = async (showSuccess = true) => {
            const p = (str) => str.split(',').map(s=>parseFloat(s.trim().replace(',','.'))).filter(n=>!isNaN(n));
            window.auditoriaSystemRates.previdencia = {
                pfNaoProdutor:{inss:p(document.getElementById('cfg-prev-pf-nao-inss').value)}, pjNaoProdutor:{inss:p(document.getElementById('cfg-prev-pj-nao-inss').value)},
                pfProdutor:{inss:p(document.getElementById('cfg-prev-pf-prod-inss').value), senar:p(document.getElementById('cfg-prev-pf-prod-senar').value), gilrat:p(document.getElementById('cfg-prev-pf-prod-gilrat').value)},
                pjProdutor:{inss:p(document.getElementById('cfg-prev-pj-prod-inss').value), senar:p(document.getElementById('cfg-prev-pj-prod-senar').value), gilrat:p(document.getElementById('cfg-prev-pj-prod-gilrat').value)}
            };
            const nt = [];
            window.auditoriaSystemRates.irpfTabela.forEach((_, i) => { const cv = document.getElementById(`irpf-cap-${i}`).value.trim(), av = document.getElementById(`irpf-aliq-${i}`).value.trim(); nt.push({capacidade:cv===''?null:parseFloat(cv.replace(',','.')), aliq:parseFloat(av.replace(',','.'))||0}); });
            window.auditoriaSystemRates.irpfTabela = nt;
            window.auditoriaSystemRates.irpfReducao = {
                descontoSimplificado: parseFloat(document.getElementById('cfg-desc-simplificado').value.replace(',','.'))||0, limiteIsencao: parseFloat(document.getElementById('cfg-reducao-isencao').value.replace(',','.'))||0,
                limiteParcial: parseFloat(document.getElementById('cfg-reducao-parcial').value.replace(',','.'))||0, parcelaFixa: parseFloat(document.getElementById('cfg-reducao-fixa').value.replace(',','.'))||0, fatorMult: parseFloat(document.getElementById('cfg-reducao-mult').value.replace(',','.'))||0
            };
            
            await window.persistAuditoriaRates(showSuccess);

            window.populateClassificacoesDropdowns(); window.handleContribuinteChange();
        };

        window.initAuditoria = async () => {
            const localRates = localStorage.getItem('auditoriaSystemRates');
            const mergeRates = (savedRates) => {
                const defaults = window.auditoriaSystemRates;
                window.auditoriaSystemRates = {
                    ...defaults,
                    ...savedRates,
                    previdencia: { ...defaults.previdencia, ...savedRates.previdencia },
                    irpfReducao: { ...defaults.irpfReducao, ...savedRates.irpfReducao }
                };
            };
            try {
                const savedConfig = await getDoc(doc(db, 'artifacts', appId, 'config', 'taxAuditor'));
                if (savedConfig.exists()) mergeRates(savedConfig.data());
                else if (localRates) {
                    mergeRates(JSON.parse(localRates));
                    await window.persistAuditoriaRates();
                }
            } catch (error) {
                console.error('Erro ao carregar configurações fiscais da nuvem:', error);
                if (localRates) mergeRates(JSON.parse(localRates));
                showToast('Não foi possível carregar as configurações da nuvem.', 'error');
            }
            try { localStorage.setItem('auditoriaSystemRates', JSON.stringify(window.auditoriaSystemRates)); } catch (error) {}
            
            window.populateClassificacoesDropdowns(); window.setupDropdownListeners('pf'); window.setupDropdownListeners('pj');
            window.loadSettingsInputs(); window.renderIRPFTableConfig(); window.renderGruposConfig(); window.renderReinfConfig(); window.renderConferidoresConfig();
            window.handleContribuinteChange();
            document.querySelectorAll('#cfg-prev-section input, #cfg-irpf-section input').forEach(input => {
                input.addEventListener('change', () => window.salvarConfiguracoes(false));
            });
            
            document.querySelectorAll('.currency-mask').forEach(i => {
                i.addEventListener('input', e => { e.target.value = window.formatToMask(e.target.value.replace(/\D/g, '')); window.calculateAll(); });
                i.addEventListener('blur', window.formatInputOnBlurOrEnter);
            });
            const vnf = document.getElementById('calc-valor-nf');
            vnf.addEventListener('blur', (e) => {
                window.formatInputOnBlurOrEnter(e); const val = e.target.value;
                ['calc-base-prev', 'calc-base-iss', 'calc-base-irrf-pj', 'calc-base-irrf-pf'].forEach(id => { const el = document.getElementById(id); if(!el.value || el.dataset.synced==="true") { el.value=val; el.dataset.synced="true"; } });
                window.calculateAll();
            });
            ['calc-base-prev', 'calc-base-iss', 'calc-base-irrf-pj', 'calc-base-irrf-pf'].forEach(id => { document.getElementById(id).addEventListener('input', e => e.target.dataset.synced="false"); document.getElementById(id).dataset.synced="true"; });
            ['calc-aliq-inss', 'calc-aliq-irrf-pj', 'calc-aliq-senar', 'calc-aliq-gilrat'].forEach(id => { const e = document.getElementById(id); if(e) e.addEventListener('change', window.calculateAll); });
            const dedPf = document.getElementById('calc-deducao-irrf-pf'); dedPf.addEventListener('input', function(){ this.dataset.auto="false"; }); dedPf.addEventListener('blur', function(){ if(window.parseCurrency(this.value)===0 || this.value.trim()==='') this.dataset.auto="true"; window.calculateAll(); });
            
            ['prev', 'iss', 'irrf-pf', 'irrf-pj'].forEach(id => { if(document.getElementById(`nao-incide-${id}`).checked) window.toggleIncidencia(id); });
        };

        // ==========================================
        
        if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
        const startApp = async () => {
            try { await signInAnonymously(auth); } catch (error) {}
            setupRealtimeListeners(); renderApp();
        };
        startApp();
    </script>
</body>
</html>
